[window]
# Window title displayed in the title bar
title = cava
# Initial window dimensions in pixels
width = 800
height = 600
# Initial window position (x, y)
x = 0
y = 0
# Window positioning: none, or specific coordinates x,y
position = none
# Start in fullscreen mode
fullscreen = false
# Allow user to resize the window
resizable = true
# Show window decorations (title bar, borders)
decorations = true
# Enable transparent window background
transparent = false
# Start maximized
maximized = false
# Minimum window size constraints (0 = no minimum)
min_width = 0
min_height = 0
# Maximum window size constraints (0 = no maximum)
max_width = 0
max_height = 0

# macOS-specific window options
# Make title bar transparent
macos_titlebar_transparent = false
# Hide title bar completely
macos_titlebar_hidden = false
# Hide title bar buttons (close, minimize, maximize)
macos_titlebar_buttons_hidden = false
# Hide window title text
macos_title_hidden = false
# Extend content into title bar area
macos_fullsize_content_view = false
# Show window shadow
macos_has_shadow = true
# Treat Option key as Alt (empty = default behavior)
macos_option_as_alt =
# Window tabbing identifier (empty = no tabbing)
macos_tabbing_identifier =
# Borderless game mode (no window chrome)
macos_borderless_game = false
# Disable HiDPI/Retina rendering
macos_disallow_hidpi = false
